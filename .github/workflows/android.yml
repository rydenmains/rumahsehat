name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug:
    name: Build debug + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug + test
        run: ./gradlew assembleUserDebug testUserDebugUnitTest --no-daemon
        env:
          RS_API_TOKEN: ${{ secrets.RS_API_TOKEN }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-user-debug
          path: app/build/outputs/apk/user/debug/app-user-debug.apk
          if-no-files-found: error

  matrix-smoke:
    name: Smoke API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [23, 26, 29, 35]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleUserDebug --no-daemon
        env:
          RS_API_TOKEN: ${{ secrets.RS_API_TOKEN }}

      - name: Smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/user/debug/app-user-debug.apk
            adb logcat -c
            adb shell am start -n com.rumahsehat.user/com.rumahsehat.ui.MainActivity
            sleep 8
            adb shell monkey -p com.rumahsehat.user --throttle 100 500
            sleep 3
            adb logcat -d | grep -E "FATAL EXCEPTION| E AndroidRuntime" && exit 1 || echo "PASS no crash"

  build-release:
    name: Build signed release (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Butuh secrets di repo Settings > Secrets:
      #   RS_KEYSTORE_BASE64    -> base64 dari rumahsehat-upload.keystore
      #   RS_KEYSTORE_PASSWORD  -> password keystore (sama dengan keyPassword)
      #   RS_API_TOKEN          -> token backend (BuildConfig.API_TOKEN)
      - name: Decode keystore
        env:
          RS_KEYSTORE_BASE64: ${{ secrets.RS_KEYSTORE_BASE64 }}
        run: echo "$RS_KEYSTORE_BASE64" | base64 -d > rumahsehat-upload.keystore

      - name: Build signed release
        run: ./gradlew assembleUserRelease --no-daemon
        env:
          RS_API_TOKEN: ${{ secrets.RS_API_TOKEN }}
          RS_KEYSTORE_PASSWORD: ${{ secrets.RS_KEYSTORE_PASSWORD }}

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: app-user-release
          path: app/build/outputs/apk/user/release/app-user-release.apk
          if-no-files-found: error

  distribute-firebase:
    name: Distribute to Firebase App Distribution (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Secrets: RS_KEYSTORE_BASE64, RS_KEYSTORE_PASSWORD, RS_API_TOKEN (sama),
      #   FIREBASE_APP_ID       -> App ID Android dari Firebase console
      #   FIREBASE_CREDENTIALS  -> isi JSON service account (App Distribution Admin)
      - name: Decode keystore
        env:
          RS_KEYSTORE_BASE64: ${{ secrets.RS_KEYSTORE_BASE64 }}
        run: echo "$RS_KEYSTORE_BASE64" | base64 -d > rumahsehat-upload.keystore

      - name: Write Firebase credentials
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: echo "$FIREBASE_CREDENTIALS" > "$RUNNER_TEMP/firebase.json"

      - name: Upload release to testers
        run: ./gradlew appDistributionUploadUserRelease --no-daemon
        env:
          RS_API_TOKEN: ${{ secrets.RS_API_TOKEN }}
          RS_KEYSTORE_PASSWORD: ${{ secrets.RS_KEYSTORE_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase.json
