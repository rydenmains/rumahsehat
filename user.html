<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rumah Sehat · Penilaian Saya</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="apple-touch-icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F8F6F1; --card:#FFFFFF; --ink:#1A1A1A; --muted:#666666;
    --green:#0F6A4B; --green2:#1E8E5A; --red:#C62828; --line:#EDE9E1;
    --radius:16px; --shadow:0 6px 24px rgba(15,106,75,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .page{max-width:640px;margin:0 auto;padding:16px}
  header.top{display:flex;align-items:center;gap:12px;margin:12px 0 20px}
  .logo{width:42px;height:42px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  header.top h1{margin:0;font-size:20px;font-weight:800}
  header.top p{margin:0;color:var(--muted);font-size:13px}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:8px}
  input{font-family:inherit;font-size:15px;padding:12px 14px;border:1px solid #DDD6C9;border-radius:12px;background:#fff;color:var(--ink);width:100%}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border:0;border-radius:12px;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--green2);text-decoration:none;cursor:pointer;box-shadow:0 4px 14px rgba(30,142,90,.30)}

  .chip{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800}
  .chip.ok{background:rgba(30,142,90,.15);color:#0F6A4B}
  .chip.bad{background:rgba(214,69,69,.14);color:var(--red)}

  .item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .item .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .item .comp{font-weight:800;font-size:15px}
  .item .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .item .score{margin-top:10px;font-size:13px}
  .item .score b{color:var(--green)}
  .item .notes{margin-top:8px;font-size:13px;color:var(--muted);background:#FBFAF7;border-radius:10px;padding:8px 10px}
  .empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:14px}
  footer{margin:20px 0 40px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="logo"><img src="logo.png" alt="Rumah Sehat" /></div>
    <div>
      <h1>Penilaian Saya</h1>
      <p>Rumah Sehat · riwayat penilaian pribadi</p>
    </div>
  </header>

  <section class="card" id="loginCard">
    <label for="name">Nama kamu (sesuai saat menilai)</label>
    <input id="name" type="text" placeholder="contoh: Andi" autocomplete="off" />
    <div class="hint">Hanya penilaian atas nama ini yang ditampilkan.</div>
    <button id="btnLogin" style="margin-top:12px">Lihat Penilaian Saya</button>
    <a id="dlApk" class="btn" href="index.html" style="display:block;margin-top:12px">⬇ Unduh Aplikasi Rumah Sehat</a>
  </section>

  <section id="rows"></section>
  <div class="empty" id="empty" style="display:none">Belum ada penilaian atas nama ini.</div>
  <footer><b>Rumah Sehat</b> · data dari Google Sheet</footer>
</div>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxWtEzcBaHI7MeMH_fdgV-6FkhI1QLDmlt7HAFRnokuon3wPo1kewXQPASK0nvHJp7ATQ/exec?action=data";
const NAME_KEY = "rs_user_name";
const $ = id => document.getElementById(id);

let allRows = [];

function statusOf(r){
  const raw = String(r["Status Health"]||"").toUpperCase();
  if(raw.includes("TIDAK")) return "TIDAK SEHAT";
  if(raw.includes("SEHAT")) return "SEHAT";
  return "Menunggu";
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function load(){
  try{
    const res = await fetch(ENDPOINT, {cache:"no-store"});
    const json = await res.json();
    allRows = json.rows || [];
    render();
  }catch(err){
    $("empty").style.display="block";
    $("empty").textContent = "Gagal mengambil data. Cek koneksi / URL endpoint.";
  }
}

function myName(){ return ($("name").value.trim() || "").toLowerCase(); }

function render(){
  const name = myName();
  const list = allRows.filter(r => String(r["Assessor"]||"").trim().toLowerCase() === name)
                      .sort((a,b)=> String(b["Tanggal Sync"]||"").localeCompare(String(a["Tanggal Sync"]||"")));
  const wrap = $("rows");
  wrap.innerHTML = "";
  $("empty").style.display = list.length ? "none" : "block";
  $("empty").textContent = list.length ? "" : "Belum ada penilaian atas nama ini.";
  for(const r of list){
    const st = statusOf(r);
    const div = document.createElement("div");
    div.className = "item";
    const thumb = String(r["Preview Foto"]||"").match(/IMAGE\("([^"]+)"\)/) || String(r["URL Foto"]||"").match(/https[^\s"]+/);
    div.innerHTML = `
      <div class="top">
        <div><div class="comp">${esc(r["Perusahaan / Kebun"])}</div>
        <div class="meta">${esc(r["Tanggal Sync"])}</div></div>
        <span class="chip ${st==="SEHAT"?"ok":"bad"}">${esc(st)}</span>
      </div>
      <div class="score">Skor: <b>${esc(r["Total Skor"])}</b></div>
      ${r["Catatan Field"] && r["Catatan Field"]!=="-" ? `<div class="notes">${esc(r["Catatan Field"])}</div>` : ""}
      ${thumb ? `<img src="${thumb[1]}" loading="lazy" style="width:56px;height:56px;object-fit:cover;border-radius:10px;margin-top:10px" onerror="this.style.display='none'"/>` : ""}`;
    wrap.appendChild(div);
  }
}

$("btnLogin").addEventListener("click", ()=>{
  localStorage.setItem(NAME_KEY, $("name").value);
  render();
});
$("name").addEventListener("keydown", e=>{ if(e.key==="Enter") render(); });

const saved = localStorage.getItem(NAME_KEY);
if(saved){ $("name").value = saved; }
load();
</script>
</body>
</html>
